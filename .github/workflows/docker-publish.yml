name: Docker Build and Publish

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build amd64 image for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: smoke-amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build arm64 image for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: smoke-arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Both published platforms must actually run: a missing runtime
      # dependency (like the exiftool CLI) or an unwritable working directory
      # passes the build but breaks every container. The dry-run must get past
      # the exiftool check and the scratch-dir creation, failing only on the
      # unreachable server. cache-to makes the push step reuse these exact
      # layers, so the published image is the one that was validated.
      - name: Smoke-test both images
        run: |
          for image in smoke-amd64 smoke-arm64; do
            docker run --rm --entrypoint exiftool "$image" -ver
            output=$(docker run --rm -e IMMICH_URL=https://127.0.0.1:9 -e IMMICH_API_KEY=smoke "$image" -dry-run 00000000-0000-0000-0000-000000000000 2>&1 || true)
            echo "$output"
            echo "$output" | grep -q "cannot reach Immich server"
          done

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
